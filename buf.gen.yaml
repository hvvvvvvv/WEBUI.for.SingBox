version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: guiforcores/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.14.1
    out: frontend/gen
    opt:
      - target=ts
