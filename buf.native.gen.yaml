version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: daemon/started_service.proto
      value: guiforcores/gen/native/daemon
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.9
    out: gen/native
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen/native
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.12.0
    out: frontend/gen/native
    opt: target=ts
