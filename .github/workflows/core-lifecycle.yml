name: Core lifecycle regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-process-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Native guardian, lock, logging, configuration and update tests
        run: go test -race ./bridge/platform ./bridge/storage ./bridge/logging ./bridge/config ./bridge/kernel ./bridge/appupdate -count=1 -timeout=180s
      - name: Vet changed backend packages
        run: go vet ./bridge/platform ./bridge/storage ./bridge/logging ./bridge/config ./bridge/kernel ./bridge/appupdate
