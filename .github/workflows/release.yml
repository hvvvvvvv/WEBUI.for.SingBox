name: Build webui.for.singbox

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  APP_REPOSITORY: ${{ github.repository }}

jobs:
  Prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Read release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version="$(make print-version)"
          if [ -z "$app_version" ]; then
            echo "APP_VERSION in Makefile must not be empty." >&2
            exit 1
          fi

          # Keep our stable version aligned with the GUI upstream, not the core.
          upstream_tag="$(gh api repos/GUI-for-Cores/GUI.for.SingBox/releases/latest --jq '.tag_name')"
          upstream_version="${upstream_tag#v}"
          if [ "$app_version" != "$upstream_version" ]; then
            echo "APP_VERSION ($app_version) must match GUI.for.SingBox stable ($upstream_tag). Update Makefile before publishing." >&2
            exit 1
          fi

          release_tag="$app_version"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            normalized_tag="${tag#v}"
            if [ "$normalized_tag" != "$app_version" ]; then
              echo "Git tag ($tag) does not match Makefile APP_VERSION ($app_version)." >&2
              echo "Use APP_VERSION without a leading v; tags may be either 1.2.3 or v1.2.3." >&2
              exit 1
            fi
            release_tag="$tag"
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  Build-Frontend:
    needs: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make frontend
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

  Build-Windows:
    needs: Build-Frontend
    runs-on: windows-latest
    env:
      APP_NAME: webui.for.singbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Ensure make is available
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }

      - name: Build & Pack Windows
        shell: pwsh
        run: |
          function Build-And-Pack {
            param([string]$arch)
            $env:GOOS="windows"
            $env:GOARCH=$arch

            Write-Host "==> Building Windows $arch..."
            make backend "BINARY_NAME=$($env:APP_NAME).exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows $arch build failed" }

            cd build/bin
            $zipName = "$env:APP_NAME-windows-$arch.zip"
            Compress-Archive -Path "$env:APP_NAME.exe", "LICENSE", "licenses" -DestinationPath $zipName -Force
            cd ../..
          }

          $seedNoticeDirectory = Join-Path (Get-Location).Path "build/bin/licenses/ruleset-seed"
          New-Item -ItemType Directory -Force -Path $seedNoticeDirectory | Out-Null
          Copy-Item -LiteralPath "LICENSE" -Destination "build/bin/LICENSE" -Force
          Get-ChildItem -LiteralPath "bridge/config/ruleset_seed" | Where-Object { $_.Extension -ne ".srs" } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $seedNoticeDirectory -Recurse -Force
          }
          "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA/bridge/config/ruleset_seed/source" |
            Set-Content -LiteralPath (Join-Path $seedNoticeDirectory "SOURCE.txt") -Encoding utf8

          $arches = @("amd64","arm64","386")
          foreach ($arch in $arches) { Build-And-Pack $arch }

      - uses: actions/upload-artifact@v6
        with:
          name: windows-builds
          path: build/bin/*.zip

  Build-macOS:
    needs: Build-Frontend
    runs-on: macos-latest
    env:
      APP_NAME: webui.for.singbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & Pack macOS
        run: |
          mkdir -p build/bin/licenses/ruleset-seed
          cp LICENSE build/bin/LICENSE
          cp bridge/config/ruleset_seed/README.md bridge/config/ruleset_seed/NOTICE.md bridge/config/ruleset_seed/UPSTREAM-README.md bridge/config/ruleset_seed/manifest.json bridge/config/ruleset_seed/SHA256SUMS build/bin/licenses/ruleset-seed/
          cp -R bridge/config/ruleset_seed/licenses bridge/config/ruleset_seed/source build/bin/licenses/ruleset-seed/
          printf 'Source: https://github.com/%s/tree/%s/bridge/config/ruleset_seed/source\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/bin/licenses/ruleset-seed/SOURCE.txt

          build_and_pack() {
            arch=$1
            export GOOS=darwin GOARCH=$arch

            echo "==> Building macOS $arch..."
            make backend BINARY_NAME=$APP_NAME

            cd build/bin
            zip -qr $APP_NAME-darwin-$arch.zip $APP_NAME LICENSE licenses
            cd ../..
          }

          for arch in amd64 arm64; do build_and_pack $arch; done

      - uses: actions/upload-artifact@v6
        with:
          name: macos-builds
          path: build/bin/*.zip

  Build-Linux:
    needs: Build-Frontend
    runs-on: ubuntu-latest
    env:
      APP_NAME: webui.for.singbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & Pack Linux
        run: |
          mkdir -p build/bin/licenses/ruleset-seed
          cp LICENSE build/bin/LICENSE
          cp bridge/config/ruleset_seed/README.md bridge/config/ruleset_seed/NOTICE.md bridge/config/ruleset_seed/UPSTREAM-README.md bridge/config/ruleset_seed/manifest.json bridge/config/ruleset_seed/SHA256SUMS build/bin/licenses/ruleset-seed/
          cp -R bridge/config/ruleset_seed/licenses bridge/config/ruleset_seed/source build/bin/licenses/ruleset-seed/
          printf 'Source: https://github.com/%s/tree/%s/bridge/config/ruleset_seed/source\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/bin/licenses/ruleset-seed/SOURCE.txt

          build_and_pack() {
            goarch=$1
            archive_arch=$2
            goarm=$3
            export GOOS=linux GOARCH=$goarch CGO_ENABLED=0
            export GOMIPS=softfloat
            if [ -n "$goarm" ]; then
              export GOARM=$goarm
            else
              unset GOARM
            fi

            echo "==> Building Linux $archive_arch..."
            make backend BINARY_NAME=$APP_NAME
            if ! go version -m build/bin/$APP_NAME | grep -q "CGO_ENABLED=0"; then
              echo "Linux $archive_arch binary was not built with CGO_ENABLED=0." >&2
              exit 1
            fi

            cd build/bin
            zip -qr $APP_NAME-linux-$archive_arch.zip $APP_NAME LICENSE licenses
            cd ../..
          }

          build_and_pack amd64 amd64 ""
          build_and_pack arm64 arm64 ""
          build_and_pack arm armv7 7
          build_and_pack mips mips ""
          build_and_pack mipsle mipsle ""

      - uses: actions/upload-artifact@v6
        with:
          name: linux-builds
          path: build/bin/*.zip

  Build-Container:
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Normalize container image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.Prepare.outputs.app_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.Prepare.outputs.app_version }}
            type=semver,pattern={{major}},value=${{ needs.Prepare.outputs.app_version }}
            type=sha,format=long

      - name: Build and push container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_REPOSITORY=${{ github.repository }}
            APP_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: false

      - name: Verify multi-platform image manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -e '
            any(.manifests[].platform; .os == "linux" and .architecture == "amd64") and
            any(.manifests[].platform; .os == "linux" and .architecture == "arm64") and
            any(.manifests[].platform; .os == "linux" and .architecture == "arm" and .variant == "v7")
          '

      - name: Smoke test published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          container_name="webui-for-singbox-smoke"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:9090:9090 \
            "$IMAGE@$DIGEST"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:9090/api/app/start-time >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_name"
          exit 1

      - name: Attest container image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  Release:
    needs: [Prepare, Build-Windows, Build-macOS, Build-Linux, Build-Container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-builds'
          path: release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.Prepare.outputs.release_tag }}
          name: ${{ needs.Prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
          body_path: docs/releases/${{ needs.Prepare.outputs.app_version }}.md
