name: Build webui.for.singbox

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Read release version
        id: version
        run: |
          app_version="$(make print-version)"
          if [ -z "$app_version" ]; then
            echo "APP_VERSION in Makefile must not be empty." >&2
            exit 1
          fi

          release_tag="$app_version"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            normalized_tag="${tag#v}"
            if [ "$normalized_tag" != "$app_version" ]; then
              echo "Git tag ($tag) does not match Makefile APP_VERSION ($app_version)." >&2
              echo "Use APP_VERSION without a leading v; tags may be either 1.2.3 or v1.2.3." >&2
              exit 1
            fi
            release_tag="$tag"
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  Build-Frontend:
    needs: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make frontend
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

  Build-Windows:
    needs: Build-Frontend
    runs-on: windows-latest
    env:
      APP_NAME: webui.for.singbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Ensure make is available
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }

      - name: Build & Pack Windows
        shell: pwsh
        run: |
          function Build-And-Pack {
            param([string]$arch)
            $env:GOOS="windows"
            $env:GOARCH=$arch

            Write-Host "==> Building Windows $arch..."
            make backend "BINARY_NAME=$($env:APP_NAME).exe"

            cd build/bin
            $zipName = "$env:APP_NAME-windows-$arch.zip"
            Compress-Archive -Path "$env:APP_NAME.exe" -DestinationPath $zipName -Force
            cd ../..
          }

          $arches = @("amd64","arm64","386")
          foreach ($arch in $arches) { Build-And-Pack $arch }

      - uses: actions/upload-artifact@v6
        with:
          name: windows-builds
          path: build/bin/*.zip

  Build-macOS:
    needs: Build-Frontend
    runs-on: macos-latest
    env:
      APP_NAME: webui.for.singbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & Pack macOS
        run: |
          build_and_pack() {
            arch=$1
            export GOOS=darwin GOARCH=$arch

            echo "==> Building macOS $arch..."
            make backend BINARY_NAME=$APP_NAME

            cd build/bin
            zip -q $APP_NAME-darwin-$arch.zip $APP_NAME
            cd ../..
          }

          for arch in amd64 arm64; do build_and_pack $arch; done

      - uses: actions/upload-artifact@v6
        with:
          name: macos-builds
          path: build/bin/*.zip

  Build-Linux:
    needs: Build-Frontend
    runs-on: ubuntu-latest
    env:
      APP_NAME: webui.for.singbox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & Pack Linux
        run: |
          build_and_pack() {
            goarch=$1
            archive_arch=$2
            goarm=$3
            export GOOS=linux GOARCH=$goarch
            if [ -n "$goarm" ]; then
              export GOARM=$goarm CGO_ENABLED=0
            else
              unset GOARM CGO_ENABLED
            fi

            echo "==> Building Linux $archive_arch..."
            make backend BINARY_NAME=$APP_NAME

            cd build/bin
            zip $APP_NAME-linux-$archive_arch.zip $APP_NAME
            cd ../..
          }

          build_and_pack amd64 amd64 ""
          build_and_pack arm armv7 7

      - uses: actions/upload-artifact@v6
        with:
          name: linux-builds
          path: build/bin/*.zip

  Release:
    needs: [Prepare, Build-Windows, Build-macOS, Build-Linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.Prepare.outputs.release_tag }}
          name: ${{ needs.Prepare.outputs.release_tag }}
          files: release-assets/**/*.zip
          draft: false
          prerelease: ${{ contains(needs.Prepare.outputs.release_tag, 'dev') }}
          body: |
            Auto-generated release from GitHub Actions.
