name: Test and cross-compile

on:
  push:
    branches: [main, 'codex/**', review/gui-parity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      WEBUI_PLUGIN_REPO: ${{ github.workspace }}/.plugin-tests
    steps:
      - uses: actions/checkout@v6
      - name: Check out independent plugins for integration tests only
        uses: actions/checkout@v6
        with:
          repository: Ghostdehole/WEBUI.for.SingBox-Plugins
          # Pin test fixtures; the runtime plugin center still follows the independent catalog.
          ref: 7dde308b3203a197c3700167bc367a21d8bb8232
          path: .plugin-tests
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: go run ./tests ./... -count=1 -timeout=180s
      - run: go run ./cmd/plugin-check ./.plugin-tests
      - if: runner.os == 'Linux'
        run: go run ./tests -race -short ./... -count=1 -timeout=180s
      - if: matrix.os == 'ubuntu-latest'
        name: Static Linux cross-compilation
        shell: bash
        run: |
          mkdir -p build/check
          for arch in amd64 arm64 arm mips mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM=7 GOMIPS=softfloat \
              go build -trimpath -o "build/check/server-$arch" .
            go version -m "build/check/server-$arch" | grep 'CGO_ENABLED=0'
          done
      - if: matrix.os == 'ubuntu-latest'
        name: Cross-compile other published desktop targets
        shell: bash
        run: |
          for target in windows/386 windows/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o "build/check/server-${target/\//-}" .
          done

  core-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.14.4'
            sha256: 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968
          - version: '1.15.0-alpha.13'
            sha256: bfc39f643a5ecc1b702c5723ff662e61dde813f12b3af0d0cfce4f629ff74047
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download and verify the released core
        shell: bash
        env:
          CORE_VERSION: ${{ matrix.version }}
          CORE_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/compat-core"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --retry 2 \
            "https://github.com/SagerNet/sing-box/releases/download/v${CORE_VERSION}/sing-box-${CORE_VERSION}-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/compat-core/core.tar.gz"
          printf '%s  %s\n' "$CORE_SHA256" "$RUNNER_TEMP/compat-core/core.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/compat-core/core.tar.gz" -C "$RUNNER_TEMP/compat-core" --strip-components=1
          "$RUNNER_TEMP/compat-core/sing-box" version
          for variable in SING_BOX_TEST_BINARY SINGBOX_NATIVE_TEST_BINARY SING_BOX_COMPAT_BINARY; do
            printf '%s=%s\n' "$variable" "$RUNNER_TEMP/compat-core/sing-box" >> "$GITHUB_ENV"
          done
      - name: Check generated profiles, rule cache and native API lifecycle on loopback
        # Real TUN routing is tested separately in disposable network namespaces.
        run: go run ./tests ./bridge/config ./bridge/kernel ./bridge/transport/http -count=1 -timeout=180s
      - name: Verify bundled rule data and reproducible source
        if: matrix.version == '1.14.4'
        run: |
          seed_commit=$(node -p 'require("./bridge/config/ruleset_seed/manifest.json").snapshot')
          node scripts/update-ruleset-seed.mjs --commit "$seed_commit" --core "$SING_BOX_TEST_BINARY" --manifest bridge/config/ruleset_seed/manifest.json --verify-only

  router-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        openwrt: ['21.02.7', '24.10.4']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Ghostdehole/WEBUI.for.SingBox-Plugins
          # Pin test fixtures; the runtime plugin center still follows the independent catalog.
          ref: 7dde308b3203a197c3700167bc367a21d8bb8232
          path: .plugin-tests
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Build ARM64 application and guest checks
        shell: bash
        run: |
          mkdir -p build/compat
          go build -o build/compat/test-runner ./tests
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm64
          go build -trimpath -o build/compat/webui.for.singbox .
          build/compat/test-runner -c -o build/compat/auth.test ./bridge/auth
          build/compat/test-runner -c -o build/compat/config.test ./bridge/config
          go build -o build/compat/plugin-goja ./.plugin-tests/tests/goja/main.go
      - name: Install isolated VM tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils e2fsprogs openssh-client
      - name: Boot OpenWrt ARM64 with 512 MiB RAM and verify services, auth, routing and plugins
        run: bash tests/compat/openwrt-vm.sh '${{ matrix.openwrt }}' build/compat .plugin-tests
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-${{ matrix.openwrt }}-logs
          path: build/compat/*.log

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke-test container defaults and argument forwarding
        shell: bash
        run: |
          docker build -t webui:test .
          docker run --rm webui:test --help > build-help.txt
          grep 'Usage: webui.for.singbox' build-help.txt
          docker run -d --name webui-smoke --memory 512m --cpus 2 \
            -e GFS_HOST=:: -p 127.0.0.1:49091:9090 webui:test --log-days 0
          trap 'docker logs webui-smoke; docker rm -f webui-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:49091/api/app/start-time; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:49091/api/app/start-time
          docker exec webui-smoke sh -c 'test ! -d /app/data/logs/app'
