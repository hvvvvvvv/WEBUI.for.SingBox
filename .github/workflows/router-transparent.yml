name: Isolated transparent routing

on:
  push:
    branches: [main, review/gui-parity]
    paths:
      - 'bridge/config/**'
      - 'tests/fixtures/**'
      - 'tests/compat/router-transparent.*'
      - 'tests/integration/router-dns-chain.*'
      - 'tests/integration/test_router_dns_chain.py'
      - '.github/workflows/router-transparent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transparent-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ensure nftables tooling for the auto redirect matrix
        shell: bash
        run: |
          if ! command -v nft >/dev/null; then
            sudo timeout 180s apt-get update -qq
            sudo timeout 180s apt-get install --yes --no-install-recommends nftables
          fi
      - name: Prepare the real core and generated default profile
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/transparent-core"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --retry 2 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/transparent-core/core.tar.gz"
          printf '%s  %s\n' 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968 \
            "$RUNNER_TEMP/transparent-core/core.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/transparent-core/core.tar.gz" -C "$RUNNER_TEMP/transparent-core" --strip-components=1
          python3 -m py_compile tests/compat/router-transparent.py
          bash -n tests/compat/router-transparent.sh
          python3 -m py_compile tests/integration/router-dns-chain.py
          python3 -m unittest discover -s tests/integration -p 'test_router_dns_chain.py'
          bash -n tests/integration/router-dns-chain.sh
          go run tests/compat/router-transparent.go "$RUNNER_TEMP/transparent"
          go build -o "$RUNNER_TEMP/transparent/probe" tests/compat/router-transparent.go
      - name: Verify LAN forwarding in disposable network namespaces
        shell: bash
        run: |
          sudo bash tests/compat/router-transparent.sh \
            "$RUNNER_TEMP/transparent-core/sing-box" "$RUNNER_TEMP/transparent"
      - name: Verify native/hijack DNS forwarding with and without auto redirect
        shell: bash
        run: |
          sudo bash tests/integration/router-dns-chain.sh \
            "$RUNNER_TEMP/transparent-core/sing-box" "$RUNNER_TEMP/transparent" "$RUNNER_TEMP/dns-chain"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transparent-routing-logs
          path: ${{ runner.temp }}/transparent/*.log
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dns-forwarding-matrix-logs
          path: |
            ${{ runner.temp }}/dns-chain/**/*.log
            ${{ runner.temp }}/dns-chain/**/*.jsonl
            ${{ runner.temp }}/dns-chain/**/config.redacted.json
            ${{ runner.temp }}/dns-chain/**/tun.*.json
            ${{ runner.temp }}/dns-chain/host-*.json
            ${{ runner.temp }}/dns-chain/host-*.sha256
          retention-days: 7
