syntax = "proto3";

package app.v1;

option go_package = "guiforcores/proto/app/v1";

import "app/v1/task.proto";
import "common/v1/sync.proto";

message ListRuleSetsRequest {}

message ListRuleSetsResponse {
  repeated string rulesets_json = 1;
  string hub_json = 2;
  common.v1.ResourceState state = 3;
}

message CreateRuleSetRequest {
  string ruleset_json = 1;
}

message CreateRuleSetResponse {
  string ruleset_json = 1;
  common.v1.MutationState state = 2;
}

message UpdateRuleSetConfigRequest {
  string ruleset_json = 1;
  common.v1.ExpectedRevision expected_revision = 2;
}

message UpdateRuleSetConfigResponse {
  string ruleset_json = 1;
  common.v1.MutationState state = 2;
}

message DeleteRuleSetRequest {
  string id = 1;
  common.v1.ExpectedRevision expected_revision = 2;
}

message DeleteRuleSetResponse {
  common.v1.MutationState state = 1;
}

message ReorderRuleSetsRequest {
  repeated string ids = 1;
  common.v1.ExpectedRevision expected_order_revision = 2;
}

message ReorderRuleSetsResponse {
  repeated string ids = 1;
  common.v1.MutationState state = 2;
}

message UpdateRuleSetRequest {
  string id = 1;
}

message UpdateRuleSetResponse {
  repeated TaskResult results = 1;
  common.v1.MutationState state = 2;
}

message UpdateAllRuleSetsRequest {}

message UpdateAllRuleSetsResponse {
  repeated TaskResult results = 1;
  common.v1.MutationState state = 2;
}

message UpdateRuleSetHubRequest {}

message UpdateRuleSetHubResponse {
  string hub_json = 1;
  common.v1.MutationState state = 2;
}

message PreviewRuleSetHubRequest {
  int32 index = 1;
  string format = 2;
}

message PreviewRuleSetHubResponse {
  string content = 1;
}

message GetRuleSetContentRequest {
  string id = 1;
}

message GetRuleSetContentResponse {
  string content = 1;
  common.v1.ExpectedRevision revision = 2;
}

message SaveRuleSetContentRequest {
  string id = 1;
  string content = 2;
  common.v1.ExpectedRevision expected_revision = 3;
}

message SaveRuleSetContentResponse {
  string ruleset_json = 1;
  common.v1.MutationState state = 2;
}

message ClearRuleSetContentRequest {
  string id = 1;
  common.v1.ExpectedRevision expected_revision = 2;
}

message ClearRuleSetContentResponse {
  string ruleset_json = 1;
  common.v1.MutationState state = 2;
}

service RuleSetService {
  rpc ListRuleSets(ListRuleSetsRequest) returns (ListRuleSetsResponse);
  rpc CreateRuleSet(CreateRuleSetRequest) returns (CreateRuleSetResponse);
  rpc UpdateRuleSetConfig(UpdateRuleSetConfigRequest) returns (UpdateRuleSetConfigResponse);
  rpc DeleteRuleSet(DeleteRuleSetRequest) returns (DeleteRuleSetResponse);
  rpc ReorderRuleSets(ReorderRuleSetsRequest) returns (ReorderRuleSetsResponse);
  rpc UpdateRuleSet(UpdateRuleSetRequest) returns (UpdateRuleSetResponse);
  rpc UpdateAllRuleSets(UpdateAllRuleSetsRequest) returns (UpdateAllRuleSetsResponse);
  rpc UpdateRuleSetHub(UpdateRuleSetHubRequest) returns (UpdateRuleSetHubResponse);
  rpc PreviewRuleSetHub(PreviewRuleSetHubRequest) returns (PreviewRuleSetHubResponse);
  rpc GetRuleSetContent(GetRuleSetContentRequest) returns (GetRuleSetContentResponse);
  rpc SaveRuleSetContent(SaveRuleSetContentRequest) returns (SaveRuleSetContentResponse);
  rpc ClearRuleSetContent(ClearRuleSetContentRequest) returns (ClearRuleSetContentResponse);
}
