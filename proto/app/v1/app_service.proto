syntax = "proto3";

package app.v1;

option go_package = "guiforcores/gen/app/v1";

message GetAppSettingsRequest {}
message GetAppSettingsResponse {
  string settings_json = 1;
}
message SaveAppSettingsRequest {
  string settings_json = 1;
}
message SaveAppSettingsResponse {
  string settings_json = 1;
}

enum KernelBranch {
  KERNEL_BRANCH_UNSPECIFIED = 0;
  KERNEL_BRANCH_MAIN = 1;
  KERNEL_BRANCH_ALPHA = 2;
}

message CoreRuntimeConfig {
  map<string, string> env = 1;
  repeated string args = 2;
}

message AppConfig {
  bool auto_start_kernel = 1;
  bool auto_restart_kernel = 2;
  string user_agent = 3;
  string github_api_token = 4;
  bool rolling_release = 5;
  KernelBranch branch = 6;
  string profile = 7;
  CoreRuntimeConfig main = 8;
  CoreRuntimeConfig alpha = 9;
}

message GetAppConfigRequest {}
message GetAppConfigResponse {
  AppConfig config = 1;
}
message SaveAppConfigRequest {
  AppConfig config = 1;
}
message SaveAppConfigResponse {
  AppConfig config = 1;
}

message ListSubscriptionsRequest {}
message ListSubscriptionsResponse {
  repeated string subscriptions_json = 1;
}
message SaveSubscriptionsRequest {
  repeated string subscriptions_json = 1;
}
message SaveSubscriptionsResponse {
  repeated string subscriptions_json = 1;
}
message UpsertSubscriptionRequest {
  string subscription_json = 1;
}
message UpsertSubscriptionResponse {
  string subscription_json = 1;
}
message DeleteSubscriptionRequest {
  string id = 1;
}
message DeleteSubscriptionResponse {}
message UpdateSubscriptionRequest {
  string id = 1;
}
message UpdateSubscriptionResponse {
  repeated TaskResult results = 1;
}
message UpdateAllSubscriptionsRequest {}
message UpdateAllSubscriptionsResponse {
  repeated TaskResult results = 1;
}

message ListRuleSetsRequest {}
message ListRuleSetsResponse {
  repeated string rulesets_json = 1;
  string hub_json = 2;
}
message SaveRuleSetsRequest {
  repeated string rulesets_json = 1;
}
message SaveRuleSetsResponse {
  repeated string rulesets_json = 1;
}
message UpsertRuleSetRequest {
  string ruleset_json = 1;
}
message UpsertRuleSetResponse {
  string ruleset_json = 1;
}
message DeleteRuleSetRequest {
  string id = 1;
}
message DeleteRuleSetResponse {}
message UpdateRuleSetRequest {
  string id = 1;
}
message UpdateRuleSetResponse {
  repeated TaskResult results = 1;
}
message UpdateAllRuleSetsRequest {}
message UpdateAllRuleSetsResponse {
  repeated TaskResult results = 1;
}
message UpdateRuleSetHubRequest {}
message UpdateRuleSetHubResponse {
  string hub_json = 1;
}
message GetRuleSetContentRequest {
  string id = 1;
}
message GetRuleSetContentResponse {
  string content = 1;
}
message SaveRuleSetContentRequest {
  string id = 1;
  string content = 2;
}
message SaveRuleSetContentResponse {
  string ruleset_json = 1;
}
message ClearRuleSetContentRequest {
  string id = 1;
}
message ClearRuleSetContentResponse {
  string ruleset_json = 1;
}

message ListScheduledTasksRequest {}
message ListScheduledTasksResponse {
  repeated string tasks_json = 1;
}
message SaveScheduledTasksRequest {
  repeated string tasks_json = 1;
}
message SaveScheduledTasksResponse {
  repeated string tasks_json = 1;
}
message UpsertScheduledTaskRequest {
  string task_json = 1;
}
message UpsertScheduledTaskResponse {
  string task_json = 1;
}
message DeleteScheduledTaskRequest {
  string id = 1;
}
message DeleteScheduledTaskResponse {}
message RunScheduledTaskRequest {
  string id = 1;
}
message RunScheduledTaskResponse {
  repeated TaskResult results = 1;
  int64 start_time = 2;
  int64 end_time = 3;
}
message ListScheduledTaskLogsRequest {
  string id = 1;
}
message ListScheduledTaskLogsResponse {
  repeated TaskLog logs = 1;
}
message ClearScheduledTaskLogsRequest {}
message ClearScheduledTaskLogsResponse {}
message NextScheduledTaskRunsRequest {
  string cron = 1;
  int32 count = 2;
}
message NextScheduledTaskRunsResponse {
  repeated int64 times = 1;
}

message TaskResult {
  bool ok = 1;
  string id = 2;
  string name = 3;
  string result = 4;
}

message TaskLog {
  string id = 1;
  string name = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  repeated TaskResult results = 5;
}

service AppSettingsService {
  rpc GetAppSettings(GetAppSettingsRequest) returns (GetAppSettingsResponse);
  rpc SaveAppSettings(SaveAppSettingsRequest) returns (SaveAppSettingsResponse);
}

service AppConfigService {
  rpc GetAppConfig(GetAppConfigRequest) returns (GetAppConfigResponse);
  rpc SaveAppConfig(SaveAppConfigRequest) returns (SaveAppConfigResponse);
}

service SubscriptionService {
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc SaveSubscriptions(SaveSubscriptionsRequest) returns (SaveSubscriptionsResponse);
  rpc UpsertSubscription(UpsertSubscriptionRequest) returns (UpsertSubscriptionResponse);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc UpdateAllSubscriptions(UpdateAllSubscriptionsRequest) returns (UpdateAllSubscriptionsResponse);
}

service RuleSetService {
  rpc ListRuleSets(ListRuleSetsRequest) returns (ListRuleSetsResponse);
  rpc SaveRuleSets(SaveRuleSetsRequest) returns (SaveRuleSetsResponse);
  rpc UpsertRuleSet(UpsertRuleSetRequest) returns (UpsertRuleSetResponse);
  rpc DeleteRuleSet(DeleteRuleSetRequest) returns (DeleteRuleSetResponse);
  rpc UpdateRuleSet(UpdateRuleSetRequest) returns (UpdateRuleSetResponse);
  rpc UpdateAllRuleSets(UpdateAllRuleSetsRequest) returns (UpdateAllRuleSetsResponse);
  rpc UpdateRuleSetHub(UpdateRuleSetHubRequest) returns (UpdateRuleSetHubResponse);
  rpc GetRuleSetContent(GetRuleSetContentRequest) returns (GetRuleSetContentResponse);
  rpc SaveRuleSetContent(SaveRuleSetContentRequest) returns (SaveRuleSetContentResponse);
  rpc ClearRuleSetContent(ClearRuleSetContentRequest) returns (ClearRuleSetContentResponse);
}

service ScheduledTaskService {
  rpc ListScheduledTasks(ListScheduledTasksRequest) returns (ListScheduledTasksResponse);
  rpc SaveScheduledTasks(SaveScheduledTasksRequest) returns (SaveScheduledTasksResponse);
  rpc UpsertScheduledTask(UpsertScheduledTaskRequest) returns (UpsertScheduledTaskResponse);
  rpc DeleteScheduledTask(DeleteScheduledTaskRequest) returns (DeleteScheduledTaskResponse);
  rpc RunScheduledTask(RunScheduledTaskRequest) returns (RunScheduledTaskResponse);
  rpc ListScheduledTaskLogs(ListScheduledTaskLogsRequest) returns (ListScheduledTaskLogsResponse);
  rpc ClearScheduledTaskLogs(ClearScheduledTaskLogsRequest) returns (ClearScheduledTaskLogsResponse);
  rpc NextScheduledTaskRuns(NextScheduledTaskRunsRequest) returns (NextScheduledTaskRunsResponse);
}
