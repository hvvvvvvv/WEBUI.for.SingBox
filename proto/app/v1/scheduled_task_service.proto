syntax = "proto3";

package app.v1;

option go_package = "guiforcores/proto/app/v1";

import "app/v1/task.proto";
import "common/v1/sync.proto";

message ListScheduledTasksRequest {}

message ListScheduledTasksResponse {
  repeated string tasks_json = 1;
  common.v1.ResourceState state = 2;
}

message CreateScheduledTaskRequest {
  string task_json = 1;
}

message CreateScheduledTaskResponse {
  string task_json = 1;
  common.v1.MutationState state = 2;
}

message UpdateScheduledTaskRequest {
  string task_json = 1;
  common.v1.ExpectedRevision expected_revision = 2;
}

message UpdateScheduledTaskResponse {
  string task_json = 1;
  common.v1.MutationState state = 2;
}

message DeleteScheduledTaskRequest {
  string id = 1;
  common.v1.ExpectedRevision expected_revision = 2;
}

message DeleteScheduledTaskResponse {
  common.v1.MutationState state = 1;
}

message ReorderScheduledTasksRequest {
  repeated string ids = 1;
  common.v1.ExpectedRevision expected_order_revision = 2;
}

message ReorderScheduledTasksResponse {
  repeated string ids = 1;
  common.v1.MutationState state = 2;
}

message RunScheduledTaskRequest {
  string id = 1;
}

message RunScheduledTaskResponse {
  repeated TaskResult results = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  common.v1.MutationState state = 4;
}

message ListScheduledTaskLogsRequest {
  string id = 1;
}

message ListScheduledTaskLogsResponse {
  repeated TaskLog logs = 1;
}

message ClearScheduledTaskLogsRequest {}

message ClearScheduledTaskLogsResponse {}

message NextScheduledTaskRunsRequest {
  string cron = 1;
  int32 count = 2;
}

message NextScheduledTaskRunsResponse {
  repeated int64 times = 1;
}

service ScheduledTaskService {
  rpc ListScheduledTasks(ListScheduledTasksRequest) returns (ListScheduledTasksResponse);
  rpc CreateScheduledTask(CreateScheduledTaskRequest) returns (CreateScheduledTaskResponse);
  rpc UpdateScheduledTask(UpdateScheduledTaskRequest) returns (UpdateScheduledTaskResponse);
  rpc DeleteScheduledTask(DeleteScheduledTaskRequest) returns (DeleteScheduledTaskResponse);
  rpc ReorderScheduledTasks(ReorderScheduledTasksRequest) returns (ReorderScheduledTasksResponse);
  rpc RunScheduledTask(RunScheduledTaskRequest) returns (RunScheduledTaskResponse);
  rpc ListScheduledTaskLogs(ListScheduledTaskLogsRequest) returns (ListScheduledTaskLogsResponse);
  rpc ClearScheduledTaskLogs(ClearScheduledTaskLogsRequest) returns (ClearScheduledTaskLogsResponse);
  rpc NextScheduledTaskRuns(NextScheduledTaskRunsRequest) returns (NextScheduledTaskRunsResponse);
}
